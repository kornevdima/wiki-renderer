# US-278: one portable archive per platform on GitHub Releases. Pushing a tag v<x.y.z> builds once, packages and
# smoke-tests on each platform's own runner, and only when all five pass publishes the release with SHA256SUMS.
# Nothing here signs or notarises: archives are unsigned (the one-line installers of US-279, install.sh and install.ps1, are the path that never warns).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # The Node runtime inside every archive, checked against nodejs.org's SHASUMS256.txt (scripts/lib/node-dist.mjs).
  NODE_VERSION: "24.22.0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="$TAG"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $tag is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          version="${tag#v}"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build the app and the CLI
        run: |
          npm run build
          npm run build:cli
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Stage the platform-neutral tree
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/package.mjs --stage-only --out release --expect-version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage
          path: release/stage
          include-hidden-files: true
          if-no-files-found: error

  package:
    name: Package and smoke (${{ matrix.platform }}-${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, platform: darwin, arch: arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x64 }
          - { runner: ubuntu-latest, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { runner: windows-latest, platform: win, arch: x64 }
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: release/stage
      - name: Fetch the Node runtime
        id: node
        run: |
          dir=$(node scripts/ci-tools.mjs fetch-node "$NODE_VERSION" "$PLATFORM" "$ARCH" "$RUNNER_TEMP/node")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Package
        env:
          NODE_DIR: ${{ steps.node.outputs.dir }}
        run: node scripts/package.mjs "$PLATFORM" "$ARCH" "$NODE_DIR" --from-stage --stage release/stage --out release/out --expect-version "$VERSION"
      - name: Unpack into a fresh folder
        run: node scripts/ci-tools.mjs unpack release/out/wiki-renderer-${VERSION}-${PLATFORM}-${ARCH}.* "$RUNNER_TEMP/unpacked"
      - name: Check the archive contents (no native module, no .env, no src or tests)
        env:
          WR_UNPACKED: ${{ runner.temp }}/unpacked/wiki-renderer-${{ needs.build.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
        run: npx vitest run scripts/portable-contents.test.ts
      - name: Install the browser for the save step
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
      - name: Smoke test the unpacked app
        run: node scripts/smoke.mjs "$RUNNER_TEMP/unpacked/wiki-renderer-${VERSION}-${PLATFORM}-${ARCH}" --port 3310 --expect-version "$VERSION"
      # US-279: the one-line installer for this OS (install.sh, or install.ps1 on Windows) against a local server holding this
      # archive, into a temporary home; then <home>/bin/wiki-renderer --version must print the release version. This is the
      # only place install.ps1 runs before it is used on a real Windows machine.
      - name: Test the one-line installer
        run: node scripts/install-check.mjs release/out/wiki-renderer-${VERSION}-${PLATFORM}-${ARCH}.* --version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/out/wiki-renderer-*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [build, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          test "$(ls | wc -l)" -eq 5
          sha256sum wiki-renderer-* > SHA256SUMS
          cat SHA256SUMS
      # A draft first: if the upload or the check fails, nothing is public and `gh release delete "$TAG"` makes a re-run possible.
      - name: Create the draft release and upload
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" --draft --verify-tag --title "$TAG" --generate-notes $flags
      - name: Check the six files, then publish
        run: |
          expected=$(printf '%s\n' \
            "SHA256SUMS" \
            "wiki-renderer-${VERSION}-darwin-arm64.tar.gz" \
            "wiki-renderer-${VERSION}-darwin-x64.tar.gz" \
            "wiki-renderer-${VERSION}-linux-arm64.tar.gz" \
            "wiki-renderer-${VERSION}-linux-x64.tar.gz" \
            "wiki-renderer-${VERSION}-win-x64.zip" | LC_ALL=C sort)
          actual=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if [ "$expected" != "$actual" ]; then
            echo "Release assets differ from the expected six files." >&2
            echo "Expected:" >&2; echo "$expected" >&2
            echo "Actual:" >&2; echo "$actual" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false
